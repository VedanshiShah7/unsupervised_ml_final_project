<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>One-Class AUC Visualizer</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f9f9f9;
      padding: 2rem;
      color: #333;
    }
    h1 {
      margin-bottom: 1rem;
    }
    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      border-radius: 8px;
      padding: 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .section {
      margin-bottom: 1.5rem;
    }
    .score-box {
      margin-top: 1rem;
      font-size: 1.25rem;
      color: #0077cc;
      font-weight: bold;
    }
    label {
      display: block;
      margin: 0.5rem 0;
    }
    button {
      background: #0077cc;
      color: white;
      padding: 0.5rem 1.5rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover {
      background: #005fa3;
    }
    canvas {
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Deep One-Class AUC Visualizer</h1>

    <div class="section">
      <label for="dataset">Choose Dataset:</label>
      <select id="dataset" multiple size="10">
        <option value="mnist_0">MNIST - Class 0</option>
        <option value="mnist_1">MNIST - Class 1</option>
        <option value="mnist_2">MNIST - Class 2</option>
        <option value="mnist_3">MNIST - Class 3</option>
        <option value="mnist_4">MNIST - Class 4</option>
        <option value="mnist_5">MNIST - Class 5</option>
        <option value="mnist_6">MNIST - Class 6</option>
        <option value="mnist_7">MNIST - Class 7</option>
        <option value="mnist_8">MNIST - Class 8</option>
        <option value="mnist_9">MNIST - Class 9</option>
        <option value="cifar">CIFAR-10 - Class: Airplane</option>
      </select>
    </div>

    <div class="section">
      <strong>Preprocessing Layers:</strong><br />
      <label><input type="checkbox" value="batchnorm" /> BatchNorm</label>
      <label><input type="checkbox" value="dropout" /> Dropout</label>
      <label><input type="checkbox" value="whitening" /> ZCA Whitening</label>
    </div>

    <div class="section">
      <strong>Midprocessing Layers:</strong><br />
      <label><input type="checkbox" value="attention" /> Attention Block</label>
      <label><input type="checkbox" value="residual" /> Residual Skip</label>
    </div>

    <div class="section">
      <strong>Postprocessing Layers:</strong><br />
      <label><input type="checkbox" value="layernorm" /> LayerNorm</label>
      <label><input type="checkbox" value="dense" /> Dense Projection</label>
    </div>

    <button onclick="simulateAUC()">Run Simulation</button>
    <div class="score-box" id="auc-score"></div>
    <canvas id="aucChart" width="800" height="400"></canvas>
  </div>

  <script>
    const benchmarks = {
      mnist_0: 0.983,
      mnist_1: 0.986,
      mnist_2: 0.961,
      mnist_3: 0.954,
      mnist_4: 0.962,
      mnist_5: 0.949,
      mnist_6: 0.971,
      mnist_7: 0.978,
      mnist_8: 0.945,
      mnist_9: 0.963,
      cifar: 0.859
    };

    function simulateAUC() {
      const selectedOptions = [...document.getElementById('dataset').selectedOptions].map(opt => opt.value);
      const checked = [...document.querySelectorAll('input[type=checkbox]:checked')].map(cb => cb.value);

      const aucData = selectedOptions.map(dataset => {
        let baseAUC = benchmarks[dataset];
        let auc = baseAUC;

        if (checked.includes('batchnorm')) auc += 0.005;
        if (checked.includes('dropout')) auc += 0.002;
        if (checked.includes('whitening')) auc += 0.003;
        if (checked.includes('attention')) auc += 0.008;
        if (checked.includes('residual')) auc += 0.007;
        if (checked.includes('layernorm')) auc += 0.004;
        if (checked.includes('dense')) auc += 0.003;

        auc = Math.min(auc, 0.996);
        return { dataset, auc, benchmark: baseAUC };
      });

      const summaryText = aucData.map(item => `${item.dataset.toUpperCase()}: ${item.auc.toFixed(4)} (Benchmark: ${item.benchmark})`).join('<br>');
      document.getElementById('auc-score').innerHTML = summaryText;

      renderChart(aucData);
    }

    function renderChart(data) {
      const ctx = document.getElementById('aucChart').getContext('2d');
      if (window.aucChart) window.aucChart.destroy();

      window.aucChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: data.map(d => d.dataset.toUpperCase()),
          datasets: [
            {
              label: 'Benchmark AUC',
              backgroundColor: '#999',
              data: data.map(d => d.benchmark)
            },
            {
              label: 'Simulated AUC',
              backgroundColor: '#0077cc',
              data: data.map(d => d.auc)
            }
          ]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: 'top'
            }
          },
          scales: {
            y: {
              beginAtZero: false,
              min: 0.8,
              max: 1.0
            }
          }
        }
      });
    }
  </script>
</body>
</html>
